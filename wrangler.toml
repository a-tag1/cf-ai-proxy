name = "cf-ai-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-24"

# Cloudflare Workers AI binding
[ai]
binding = "AI"

[observability.logs]
enabled = true
invocation_logs = true

[env.production]
name = "cf-ai-proxy"
routes = [
  { pattern = "cf-ai-proxy.*.workers.dev", zone_name = "" }
]

[env.production.ai]
binding = "AI"
